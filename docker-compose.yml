version: '3.8'

services:
  # Streamlit App
  app:
    build: .
    container_name: inspection_copilot
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - OLLAMA_HOST=ollama:11434
    depends_on:
      - ollama
    networks:
      - copilot_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - copilot_network
    restart: unless-stopped
    # Uncomment below if you have GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  ollama_models:
    driver: local

networks:
  copilot_network:
    driver: bridge